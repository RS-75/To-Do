<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Journée</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journée">
<meta name="theme-color" content="#ECE3D0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#ECE3D0;
    --card:#F8F2E4;
    --card-soft:#F2EADA;
    --ink:#3B3226;
    --ink-soft:#948868;
    --ink-faint:#B3A88A;
    --line:#DDD1B2;
    --accent:#B8863B;
    --accent-soft:#EAD9AF;
    --sage:#71805F;
    --sage-soft:#DEE3CD;
    --rust:#A5573F;
    --rust-soft:#EAD2C7;
    --gcal:#5B7FA6;
    --gcal-soft:#E9EEF3;
  }
  
  [data-theme="dark"] {
    --bg: #121212;
    --card: #1C1C1C;
    --card-soft: #2C2C2C;
    --ink: #EAEAEA;
    --ink-soft: #A1A1A1;
    --ink-faint: #6B6B6B;
    --line: #3A3A3A;
    --accent: #D4A373;
    --accent-soft: #5C462C;
    --sage: #8DA37A;
    --sage-soft: #303A25;
    --rust: #CC7A64;
    --rust-soft: #4D2B23;
    --gcal: #759BCA;
    --gcal-soft: #263345;
  }

  /* Liquid Glass Clair (Bleu & Blanc) */
  [data-theme="glass-light"] {
    --bg: linear-gradient(135deg, #ffffff 0%, #dbeafe 100%);
    --card: rgba(255, 255, 255, 0.65);
    --card-soft: rgba(255, 255, 255, 0.4);
    --ink: #1e3a8a;
    --ink-soft: #3b82f6;
    --ink-faint: #93c5fd;
    --line: rgba(59, 130, 246, 0.2);
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.2);
    --sage: #10b981;
    --rust: #ef4444;
  }

  /* Liquid Glass Sombre (Noir & Bleu) */
  [data-theme="glass-dark"] {
    --bg: linear-gradient(135deg, #000000 0%, #0a192f 50%, #000000 100%);
    --card: rgba(10, 25, 47, 0.65);
    --card-soft: rgba(10, 25, 47, 0.4);
    --ink: #ffffff;
    --ink-soft: #93c5fd;
    --ink-faint: #3b82f6;
    --line: rgba(59, 130, 246, 0.3);
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.3);
    --sage: #34d399;
    --rust: #f87171;
  }

  /* Rétrocompatibilité si jamais la valeur "glass" ancienne traîne */
  [data-theme="glass"] {
    --bg: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    --card: rgba(255, 255, 255, 0.4);
    --card-soft: rgba(255, 255, 255, 0.2);
    --ink: #1e1e1e;
    --ink-soft: #444;
    --ink-faint: #666;
    --line: rgba(255, 255, 255, 0.4);
    --accent: #8A2BE2;
    --accent-soft: rgba(138, 43, 226, 0.3);
    --sage: #2ecc71;
    --rust: #e74c3c;
  }

  [data-theme^="glass"] body, [data-theme^="glass"] .full-page-overlay {
    background: var(--bg);
    background-attachment: fixed;
  }
  
  [data-theme^="glass"] .view-switch,
  [data-theme^="glass"] .month-grid,
  [data-theme^="glass"] .month-tile,
  [data-theme^="glass"] .chip,
  [data-theme^="glass"] .timeline-outer,
  [data-theme^="glass"] .task-card,
  [data-theme^="glass"] .account-card,
  [data-theme^="glass"] .modern-toggle,
  [data-theme^="glass"] input[type=text],
  [data-theme^="glass"] input[type=email],
  [data-theme^="glass"] input[type=tel],
  [data-theme^="glass"] input[type=datetime-local],
  [data-theme^="glass"] select,
  [data-theme^="glass"] textarea,
  [data-theme^="glass"] .qa-sheet,
  [data-theme^="glass"] .tabbar,
  [data-theme^="glass"] .quick-fab,
  [data-theme^="glass"] .collapsible-header,
  [data-theme^="glass"] .weather-pill,
  [data-theme^="glass"] .crm-header,
  [data-theme^="glass"] .crm-stat {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
  }
  [data-theme^="glass"] .view-btn.active { background: rgba(255,255,255,0.2); }
  [data-theme^="glass"] .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    box-shadow: 0 4px 14px var(--accent-soft);
  }
  [data-theme^="glass"] .month-cell.today .num,
  [data-theme^="glass"] .week-day.today .num {
    background: var(--accent);
    color: #fff;
  }
  [data-theme^="glass"] .mic-fab.listening {
    background: var(--rust);
    border-color: var(--rust);
  }

  /* ÉCRAN DE CHARGEMENT */
  #splashScreen {
    position: fixed; inset: 0; background: #ECE3D0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #splashScreen.hide { opacity: 0; visibility: hidden; }
  
  .splash-logo-box {
    width: 100px; height: 100px; background: #ECE3D0; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 24px;
    animation: pulseLogo 1.2s infinite alternate;
  }
  .splash-logo-box svg { width: 64px; height: 64px; }

  @keyframes pulseLogo {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); }
  }

  .splash-loader-bar {
    width: 120px; height: 4px; background: rgba(59, 50, 38, 0.15);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .splash-loader-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #3B3226; border-radius: 4px;
    animation: loadProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes loadProgress {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* STRUCTURE FIGÉE 100DVH */
  *{box-sizing:border-box;}
  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100dvh;
    overflow: hidden; 
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .wrap {
    max-width: 460px; margin: 0 auto;
    height: 100%; display: flex; flex-direction: column;
    position: relative;
  }

  header{ padding: 28px 16px 20px; display:flex; align-items:flex-start; justify-content:space-between; flex: 0 0 auto; }
  .day-name{ font-size:12.5px; color:var(--ink-soft); text-transform:lowercase; margin-bottom:2px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:28px; margin:0; line-height:1.05; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  
  .weather-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 10px; font-size: 12px; font-weight: 500; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,0.04); cursor: pointer; user-select: none;
    transition: transform 0.2s, background 0.2s;
  }
  .weather-pill:active { transform: scale(0.96); }
  .weather-temp { font-weight: 600; }
  .weather-city { font-size: 10.5px; color: var(--ink-soft); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ring-wrap{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .ring-num{ font-size:11px; color:var(--ink-soft); font-weight:500; }

  /* GESTION DES PANNEAUX INTERNES */
  .panel {
    display: none;
    flex: 1;
    min-height: 0;
  }
  .panel.active {
    display: flex; flex-direction: column;
  }
  
  #panel-tasks, #panel-stats, #panel-account {
    padding: 0 16px 100px 16px; 
    overflow-y: auto;
  }

  #panel-today {
    padding: 0 16px;
    overflow: hidden;
  }

  .view-switch{
    display:flex; background:var(--card-soft); border:1px solid var(--line);
    border-radius:10px; padding:3px; margin-bottom:20px; gap:2px; flex: 0 0 auto;
  }
  .view-btn{
    flex:1; background:none; border:none; border-radius:8px; padding:8px 4px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer;
  }
  .view-btn.active{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex: 0 0 auto; }
  .cal-nav-label{ font-family:'Fraunces',serif; font-size:17px; font-weight:500; text-transform:capitalize; }
  .cal-arrow{ background:none; border:none; color:var(--ink-soft); font-size:20px; padding:4px 10px; cursor:pointer; }

  /* Vues Mois/Année */
  #view-month, #view-year {
    display: flex; flex-direction: column;
    flex: 1; overflow-y: auto; padding-bottom: 100px;
  }

  .month-dow-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; flex: 0 0 auto; }
  .month-dow-row span{ text-align:center; font-size:10.5px; color:var(--ink-faint); text-transform:lowercase; }
  .month-grid{
    display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:44px; gap:2px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; margin-bottom:24px;
    flex: 0 0 auto;
  }
  .month-cell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .month-cell .num{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink); }
  .month-cell.outside .num{ color:var(--ink-faint); opacity:.5; }
  .month-cell.past .num{ color:var(--ink-faint); }
  .month-cell.today .num{ background:var(--ink); color:var(--bg); }
  .month-cell.selected:not(.today) .num{ border:1.5px solid var(--accent); }
  .month-cell .dot-indicator{ width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .month-cell .dot-indicator.empty{ background:transparent; }

  .year-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; flex: 0 0 auto;}
  .month-tile{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; cursor:pointer; }
  .month-tile.current{ border-color:var(--ink); border-width:1.5px; }
  .month-tile .m-name{ font-family:'Fraunces',serif; font-size:14px; text-transform:capitalize; margin-bottom:6px; }
  .month-tile .m-count{ font-size:11px; color:var(--ink-soft); }

  #view-day {
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
  }

  .week-strip{ display:flex; align-items:center; gap:2px; margin-bottom:20px; flex: 0 0 auto; }
  .week-arrow{ flex:0 0 auto; background:none; border:none; color:var(--ink-faint); font-size:18px; padding:4px 6px; cursor:pointer; }
  .week-days{ flex:1; display:flex; justify-content:space-between; }
  .week-day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 0; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif; transition: background 0.2s; position:relative;}
  .week-day .dow{ font-size:10px; color:var(--ink-faint); text-transform:lowercase; }
  .week-day .num{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:600; color:var(--ink); }
  .week-day.past .num{ color:var(--ink-faint); font-weight:500; }
  .week-day.today .num{ background:var(--ink); color:var(--bg); }
  .week-day.selected:not(.today) .num{ border:1.5px solid var(--accent); }
  .week-day .dot-indicator{ width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .week-day .dot-indicator.empty{ background:transparent; }
  
  /* CSS pour le drop sur un jour */
  .week-day.drag-over { background: var(--accent-soft); border-radius: 8px; }

  .section-title{ font-size:12px; letter-spacing:.01em; color:var(--ink-soft); margin:0 0 10px 2px; }

  .tag-filter-bar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
    flex: 0 0 auto;
  }
  .tag-filter-bar::-webkit-scrollbar { display: none; }
  .tag-filter-chip {
    display: flex; align-items: center; gap: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px;
    font-size: 11.5px; font-weight: 500; color: var(--ink-soft); cursor: pointer;
    flex: 0 0 auto; user-select: none; transition: all 0.2s ease;
  }
  .tag-filter-chip.active {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .tag-filter-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--fc); flex: 0 0 auto;
  }

  .tray{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:24px; scrollbar-width:none; flex: 0 0 auto; }
  .tray::-webkit-scrollbar{display:none;}
  
  .draggable-item {
    cursor: grab; user-select: none; -webkit-user-select: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .draggable-item:active { cursor: grabbing; }
  .draggable-item.dragging-origin { opacity: 0.4; transform: scale(0.95); }

  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:7px; background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:8px 12px 8px 10px; font-size:13px; white-space:nowrap;
  }
  .chip.done{opacity:.5;}
  .chip .dot{width:7px; height:7px; border-radius:50%; background:var(--task-c, var(--accent)); flex:0 0 auto;}
  .chip .txt.done{text-decoration:line-through;}
  .chip .del{background:none; border:none; color:var(--ink-faint); font-size:15px; cursor:pointer; padding:0 0 0 2px; line-height:1;}

  .timeline-outer{
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    position:relative; background:var(--card); border-radius:16px; border:1px solid var(--line);
    margin-bottom:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .timeline-scroll{
    flex: 1; overflow-y: auto; padding: 6px 0 100px 0; 
  }
  .timeline{ position:relative; padding-right:10px; }
  .hour-row{ position:relative; height:56px; display:flex; border-top:1px solid var(--line); }
  .hour-row:first-child{border-top:none;}
  .hour-label{ flex:0 0 52px; font-size:11px; color:var(--ink-faint); padding:4px 0 0 12px; font-variant-numeric: tabular-nums; }
  .lane{ flex:1; position:relative; transition: background 0.2s; }
  .lane.drag-over { background: var(--accent-soft); opacity: 0.6; }

  .task-card{
    position:absolute; left:6px; right:10px; background:var(--bg); border:1px solid var(--line);
    border-left:3px solid var(--task-c, var(--accent)); border-radius:10px; padding:7px 10px; font-size:13.5px;
    line-height:1.25; display:flex; align-items:center; gap:8px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .task-card.done{ border-left-color:var(--sage) !important; opacity:.55; }
  .task-card.late{ border-left-color:var(--rust); }
  .task-check{ flex:0 0 auto; width:16px; height:16px; border-radius:50%; border:1.4px solid var(--ink-faint); background:transparent; cursor:pointer; position:relative; padding:0; }
  .task-check.done{background:var(--sage); border-color:var(--sage);}
  .task-check.done::after{
    content:''; position:absolute; left:4px; top:1px; width:4px; height:7px;
    border:solid var(--card); border-width:0 1.6px 1.6px 0; transform:rotate(40deg);
  }
  .task-info{flex:1; min-width:0;}
  .task-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .task-title.done{text-decoration:line-through; color:var(--ink-soft);}
  .task-time{font-size:10.5px; color:var(--ink-soft);}
  .subtask-badge{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-left:4px;}
  .meet-link{color:var(--accent); text-decoration:none; font-weight:600;}
  .task-del{background:none; border:none; color:var(--ink-faint); font-size:15px; cursor:pointer; flex:0 0 auto; padding:0; line-height:1;}

  .now-line{ position:absolute; left:52px; right:0; height:0; border-top:1.5px solid var(--rust); z-index:5; }
  .now-line::before{ content:''; position:absolute; left:-4px; top:-3.5px; width:7px; height:7px; border-radius:50%; background:var(--rust); }

  .collapsible-group { margin-bottom: 16px; }
  .collapsible-header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; font-family: 'Fraunces', serif; font-size: 18px;
    font-weight: 500; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .collapsible-header .c-arrow {
    color: var(--ink-soft); transition: transform 0.3s ease;
  }
  .collapsible-header.active .c-arrow {
    transform: rotate(180deg);
  }
  .collapsible-content {
    display: none; padding: 12px 4px;
  }
  .collapsible-content.active {
    display: block;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .agenda-list{list-style:none; margin:0; padding:0;}
  .agenda-item{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .dot{width:7px; height:7px; border-radius:50%; background:var(--task-c, var(--accent)); flex:0 0 auto;}
  .agenda-item .txt{flex:1; font-size:14px;}
  .agenda-item .txt.done{text-decoration:line-through; color:var(--ink-soft);}
  .agenda-item .when{font-size:11.5px; color:var(--ink-soft); flex:0 0 auto;}
  .agenda-item .del{background:none; border:none; color:var(--ink-faint); font-size:15px; cursor:pointer; padding:0;}

  .empty-note{ color:var(--ink-faint); font-size:13px; text-align:center; padding:40px 10px; }

  .stats-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .stats-bar-bg { width: 100%; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .stats-bar-fill { height: 100%; background: var(--sage); border-radius: 4px; transition: width 0.4s ease; }

  .account-card{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 20px 26px; margin-top:10px; margin-bottom:18px;
  }
  .g-avatar{ width:84px; height:84px; border-radius:50%; object-fit:cover; background:var(--card-soft); border:1px solid var(--line); }
  .g-avatar-placeholder{ display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink-faint); font-family:'Fraunces',serif; }
  .g-name{ font-family:'Fraunces',serif; font-size:18px; font-weight:500; margin-top:14px; }
  .g-email{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  #gAccountBtn.connected{ background:transparent; color:var(--rust); border:1px solid var(--line); }
  .sync-toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:var(--ink); margin-top:18px; padding-top:16px; border-top:1px solid var(--line); width: 100%;
  }
  .sync-toggle-row select { padding: 4px 8px; border-radius: 6px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: 13px; font-family: 'Inter', sans-serif;}

  .modern-toggle {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer;
    margin-bottom: 16px; font-size: 14.5px; font-weight: 500; color: var(--ink); -webkit-tap-highlight-color: transparent;
  }
  .modern-toggle.small { padding: 10px 14px; border-radius: 12px; margin: 0 0 18px 0; font-size: 13.5px; background: transparent; border: none; padding: 0; }
  .modern-toggle input[type="checkbox"] { display: none; }
