<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journée</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journée">
<meta name="theme-color" content="#ECE3D0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECE3D0;
    --card:#F8F2E4;
    --card-soft:#F2EADA;
    --ink:#3B3226;
    --ink-soft:#948868;
    --ink-faint:#B3A88A;
    --line:#DDD1B2;
    --accent:#B8863B;
    --accent-soft:#EAD9AF;
    --sage:#71805F;
    --sage-soft:#DEE3CD;
    --rust:#A5573F;
    --rust-soft:#EAD2C7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 16px 24px;
    position:relative;
    min-height:100vh;
    padding-bottom:96px;
  }

  /* header */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .day-name{
    font-size:12.5px;
    color:var(--ink-soft);
    text-transform:lowercase;
    margin-bottom:2px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:28px;
    margin:0;
    line-height:1.05;
  }
  .ring-wrap{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .ring-num{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* section titles */
  .section-title{
    font-size:12px;
    letter-spacing:.01em;
    color:var(--ink-soft);
    margin:0 0 10px 2px;
  }

  /* tabs content */
  .panel{display:none;}
  .panel.active{display:block;}

  /* unscheduled tray */
  .tray{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:24px;
    scrollbar-width:none;
  }
  .tray::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 12px 8px 10px;
    font-size:13px;
    white-space:nowrap;
  }
  .chip.done{opacity:.5;}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .chip .txt.done{text-decoration:line-through;}
  .chip .del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:0 0 0 2px;line-height:1;}

  /* timeline */
  .timeline-outer{
    position:relative;
    background:var(--card-soft);
    border-radius:16px;
    border:1px solid var(--line);
    margin-bottom:20px;
    overflow:hidden;
  }
  .timeline-scroll{
    max-height:440px;
    overflow-y:auto;
    padding:6px 0;
  }
  .timeline{
    position:relative;
    padding-right:10px;
  }
  .hour-row{
    position:relative;
    height:56px;
    display:flex;
    border-top:1px solid var(--line);
  }
  .hour-row:first-child{border-top:none;}
  .hour-label{
    flex:0 0 52px;
    font-size:11px;
    color:var(--ink-faint);
    padding:4px 0 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .lane{flex:1;position:relative;}

  .task-card{
    position:absolute;
    left:6px;
    right:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:10px;
    padding:7px 10px;
    font-size:13.5px;
    line-height:1.25;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 1px 2px rgba(59,50,38,.05);
  }
  .task-card.done{
    border-left-color:var(--sage);
    opacity:.55;
  }
  .task-card.late{border-left-color:var(--rust);}
  .task-check{
    flex:0 0 auto;
    width:16px;height:16px;
    border-radius:50%;
    border:1.4px solid var(--ink-faint);
    background:transparent;
    cursor:pointer;
    position:relative;
    padding:0;
  }
  .task-check.done{background:var(--sage);border-color:var(--sage);}
  .task-check.done::after{
    content:'';position:absolute;left:4px;top:1px;
    width:4px;height:7px;border:solid var(--card);
    border-width:0 1.6px 1.6px 0;transform:rotate(40deg);
  }
  .task-info{flex:1;min-width:0;}
  .task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-title.done{text-decoration:line-through;color:var(--ink-soft);}
  .task-time{font-size:10.5px;color:var(--ink-soft);}
  .task-del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;flex:0 0 auto;padding:0;line-height:1;}

  .now-line{
    position:absolute;
    left:52px;right:0;
    height:0;
    border-top:1.5px solid var(--rust);
    z-index:5;
  }
  .now-line::before{
    content:'';
    position:absolute;
    left:-4px;top:-3.5px;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--rust);
  }

  /* agenda list (shared style for À venir / Fait) */
  .agenda-group{margin-bottom:20px;}
  .agenda-list{list-style:none;margin:0;padding:0;}
  .agenda-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .agenda-item .txt{flex:1;font-size:14px;}
  .agenda-item .txt.done{text-decoration:line-through;color:var(--ink-soft);}
  .agenda-item .when{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;}
  .agenda-item .del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:0;}

  .empty-note{
    color:var(--ink-faint);
    font-size:13px;
    text-align:center;
    padding:40px 10px;
  }

  /* Ajouter tab */
  .add-panel-title{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:500;
    margin:6px 0 18px;
  }
  .field-label{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 6px 2px;
  }
  input[type=text]{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    padding:12px 13px;
    margin-bottom:16px;
  }
  input[type=text]:focus{outline:2px solid var(--accent-soft);}
  input[type=datetime-local]{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    padding:11px 12px;
    margin-bottom:20px;
  }
  .btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--card);}
  .btn-primary:disabled{opacity:.35;}
  .confirm-note{
    font-size:13px;
    color:var(--sage);
    text-align:center;
    margin-top:14px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .confirm-note.show{opacity:1;}

  .notif-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:-6px 0 20px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .notif-hint button{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 10px;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
  }

  /* bottom tab bar */
  .tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    max-width:460px;
    margin:0 auto;
    z-index:20;
  }
  .tab-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    padding:6px 2px;
    cursor:pointer;
    color:var(--ink-faint);
  }
  .tab-btn svg{width:21px;height:21px;stroke:var(--ink-faint);fill:none;stroke-width:1.6;}
  .tab-btn span{font-size:10.5px;font-weight:500;}
  .tab-btn.active{color:var(--ink);}
  .tab-btn.active svg{stroke:var(--ink);}
  .tab-btn .tab-badge{
    position:absolute;
    margin-left:14px;margin-top:-3px;
    background:var(--accent);
    color:var(--card);
    font-size:9px;
    font-weight:700;
    border-radius:8px;
    min-width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="day-name" id="dayName"></div>
      <h1 id="pageTitle">Aujourd'hui</h1>
    </div>
    <div class="ring-wrap">
      <svg width="40" height="40" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="17" fill="none" stroke="#DDD1B2" stroke-width="4"/>
        <circle id="ringProgress" cx="21" cy="21" r="17" fill="none" stroke="#B8863B" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8"
                transform="rotate(-90 21 21)"/>
      </svg>
      <div class="ring-num" id="ringNum">0/0</div>
    </div>
  </header>

  <div class="notif-hint" id="notifHint" style="display:none;">
    Active les notifications pour tes rappels.
    <button id="notifBtn">Activer</button>
  </div>

  <!-- AUJOURD'HUI -->
  <section class="panel active" id="panel-today">
    <div id="trayWrap"></div>
    <div class="timeline-outer">
      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <!-- À VENIR -->
  <section class="panel" id="panel-upcoming">
    <div id="upcomingWrap"></div>
  </section>

  <!-- AJOUTER -->
  <section class="panel" id="panel-add">
    <div class="add-panel-title">Nouvelle tâche</div>
    <form id="addForm">
      <div class="field-label">Tâche</div>
      <input type="text" id="taskInput" placeholder="Que faut-il faire ?" autocomplete="off">
      <div class="field-label">Rappel (optionnel)</div>
      <input type="datetime-local" id="dateInput">
      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Ajouter</button>
      <div class="confirm-note" id="confirmNote">Ajouté ✓</div>
    </form>
  </section>

  <!-- FAIT -->
  <section class="panel" id="panel-done">
    <div id="doneWrap"></div>
  </section>

</div>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="today" style="position:relative;">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Aujourd'hui</span>
  </button>
  <button class="tab-btn" data-tab="upcoming" style="position:relative;">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>À venir</span>
  </button>
  <button class="tab-btn" data-tab="add" style="position:relative;">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Ajouter</span>
  </button>
  <button class="tab-btn" data-tab="done" style="position:relative;">
    <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
    <span>Fait</span>
  </button>
</nav>

<script>
const LOCAL_KEY = 'journee_todos_v1';
const START_HOUR = 6;
const END_HOUR = 23; // inclusive
const ROW_H = 56;
let tasks = [];
let notifiedIds = new Set();
let activeTab = 'today';

const dayName = document.getElementById('dayName');
const pageTitle = document.getElementById('pageTitle');
const timelineEl = document.getElementById('timeline');
const timelineScroll = document.getElementById('timelineScroll');
const trayWrap = document.getElementById('trayWrap');
const upcomingWrap = document.getElementById('upcomingWrap');
const doneWrap = document.getElementById('doneWrap');
const ringProgress = document.getElementById('ringProgress');
const ringNum = document.getElementById('ringNum');

const addForm = document.getElementById('addForm');
const taskInput = document.getElementById('taskInput');
const dateInput = document.getElementById('dateInput');
const submitBtn = document.getElementById('submitBtn');
const confirmNote = document.getElementById('confirmNote');
const notifHint = document.getElementById('notifHint');
const notifBtn = document.getElementById('notifBtn');

const TAB_TITLES = { today: "Aujourd'hui", upcoming: 'À venir', add: 'Ajouter', done: 'Fait' };

dayName.textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'}) + ' · ' + fmtTime(iso); }

async function loadTasks(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    tasks = raw ? JSON.parse(raw) : [];
  }catch(e){ tasks = []; }
  renderAll();
}
function persistAll(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(tasks)); }
  catch(e){ console.error('Erreur de sauvegarde', e); }
}
async function saveTask(t){ persistAll(); }
async function deleteTaskStorage(id){ persistAll(); }

/* ---------- tabs ---------- */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  pageTitle.textContent = TAB_TITLES[tab];
  if(tab === 'today') setTimeout(scrollToNow, 50);
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

/* ---------- grid / timeline ---------- */
function buildTimelineGrid(){
  let html = '';
  for(let h=START_HOUR; h<=END_HOUR; h++){
    const label = (h.toString().padStart(2,'0')) + ':00';
    html += `<div class="hour-row"><div class="hour-label">${label}</div><div class="lane"></div></div>`;
  }
  timelineEl.innerHTML = html;
}

function renderAll(){
  renderRing();
  renderTray();
  renderTimeline();
  renderUpcoming();
  renderDone();
}

function renderRing(){
  const now = new Date();
  const relevant = tasks.filter(t => !t.due || isSameDay(new Date(t.due), now));
  const total = relevant.length;
  const done = relevant.filter(t=>t.done).length;
  const circumference = 2 * Math.PI * 17;
  const pct = total === 0 ? 0 : done/total;
  ringProgress.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ringProgress.setAttribute('stroke-dashoffset', (circumference * (1-pct)).toFixed(1));
  ringNum.textContent = `${done}/${total}`;
}

function renderTray(){
  const unscheduled = tasks.filter(t=>!t.due);
  if(unscheduled.length === 0){ trayWrap.innerHTML=''; return; }
  trayWrap.innerHTML = `
    <div class="section-title">Sans horaire</div>
    <div class="tray">
      ${unscheduled.map(t => `
        <div class="chip ${t.done?'done':''}" data-id="${t.id}">
          <button class="check-btn" data-action="toggle" data-id="${t.id}" style="all:unset;cursor:pointer;display:flex;">
            <span class="dot" style="background:${t.done ? 'var(--sage)':'var(--accent)'};"></span>
          </button>
          <span class="txt ${t.done?'done':''}">${escapeHtml(t.text)}</span>
          <button class="del" data-action="delete" data-id="${t.id}">×</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTimeline(){
  buildTimelineGrid();
  const lanes = timelineEl.querySelectorAll('.lane');
  const laneByHour = {};
  let h = START_HOUR;
  lanes.forEach(l => { laneByHour[h] = l; h++; });

  const now = new Date();
  const todays = tasks.filter(t => t.due && isSameDay(new Date(t.due), now));

  todays.forEach(t => {
    const d = new Date(t.due);
    const hour = Math.min(Math.max(d.getHours(), START_HOUR), END_HOUR);
    const lane = laneByHour[hour];
    if(!lane) return;
    const minuteOffset = d.getHours() < START_HOUR ? 0 : (d.getHours() > END_HOUR ? 0 : d.getMinutes());
    const late = !t.done && d < now;
    const card = document.createElement('div');
    card.className = `task-card ${t.done?'done':''} ${late?'late':''}`;
    card.style.top = minuteOffset + 'px';
    card.dataset.id = t.id;
    card.innerHTML = `
      <button class="task-check ${t.done?'done':''}" data-action="toggle" data-id="${t.id}"></button>
      <div class="task-info">
        <div class="task-title ${t.done?'done':''}">${escapeHtml(t.text)}</div>
        <div class="task-time">${fmtTime(t.due)}${late?' · en retard':''}</div>
      </div>
      <button class="task-del" data-action="delete" data-id="${t.id}">×</button>
    `;
    lane.appendChild(card);
  });

  if(now.getHours() >= START_HOUR && now.getHours() <= END_HOUR){
    const lane = laneByHour[now.getHours()];
    if(lane){
      const line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = now.getMinutes() + 'px';
      lane.appendChild(line);
    }
  }
}

function scrollToNow(){
  const now = new Date();
  const hour = Math.min(Math.max(now.getHours(), START_HOUR), END_HOUR);
  const rowIndex = hour - START_HOUR;
  const target = Math.max(0, rowIndex * ROW_H - ROW_H * 1.5);
  timelineScroll.scrollTop = target;
}

/* ---------- upcoming tab ---------- */
function renderUpcoming(){
  const now = new Date();
  const upcoming = tasks
    .filter(t => !t.done && t.due && !isSameDay(new Date(t.due), now) && new Date(t.due) > now)
    .sort((a,b)=> new Date(a.due) - new Date(b.due));

  if(upcoming.length === 0){
    upcomingWrap.innerHTML = `<div class="empty-note">Rien de prévu pour les prochains jours.</div>`;
    return;
  }
  upcomingWrap.innerHTML = `
    <ul class="agenda-list">
      ${upcoming.map(t => `
        <li class="agenda-item" data-id="${t.id}">
          <span class="dot"></span>
          <span class="txt">${escapeHtml(t.text)}</span>
          <span class="when">${fmtDateShort(t.due)}</span>
          <button class="del" data-action="delete" data-id="${t.id}">×</button>
        </li>
      `).join('')}
    </ul>
  `;
}

/* ---------- done tab ---------- */
function renderDone(){
  const done = tasks
    .filter(t => t.done)
    .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));

  if(done.length === 0){
    doneWrap.innerHTML = `<div class="empty-note">Rien de terminé pour l'instant.</div>`;
    return;
  }
  doneWrap.innerHTML = `
    <ul class="agenda-list">
      ${done.map(t => `
        <li class="agenda-item" data-id="${t.id}">
          <span class="dot" style="background:var(--sage);"></span>
          <span class="txt done">${escapeHtml(t.text)}</span>
          ${t.due ? `<span class="when">${fmtDateShort(t.due)}</span>` : ''}
          <button class="del" data-action="delete" data-id="${t.id}">×</button>
        </li>
      `).join('')}
    </ul>
  `;
}

/* ---------- interactions ---------- */
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;

  if(action === 'toggle'){
    t.done = !t.done;
    renderAll();
    await saveTask(t);
  } else if(action === 'delete'){
    tasks = tasks.filter(x=>x.id!==id);
    renderAll();
    await deleteTaskStorage(id);
  }
});

taskInput.addEventListener('input', ()=>{
  submitBtn.disabled = taskInput.value.trim().length === 0;
});

addForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = taskInput.value.trim();
  if(!text) return;
  const t = {
    id: uid(),
    text,
    due: dateInput.value ? new Date(dateInput.value).toISOString() : null,
    done: false,
    createdAt: Date.now()
  };
  tasks.push(t);
  renderAll();
  await saveTask(t);
  taskInput.value = '';
  dateInput.value = '';
  submitBtn.disabled = true;
  confirmNote.classList.add('show');
  setTimeout(()=> confirmNote.classList.remove('show'), 1400);
});

/* ---------- notifications ---------- */
function setupNotifPrompt(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){ notifHint.style.display='flex'; }
}
notifBtn && notifBtn.addEventListener('click', async ()=>{
  try{
    const perm = await Notification.requestPermission();
    if(perm==='granted') notifHint.style.display='none';
  }catch(e){}
});
function checkReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  for(const t of tasks){
    if(t.done || !t.due || notifiedIds.has(t.id)) continue;
    if(new Date(t.due).getTime() <= now){
      try{ new Notification('Rappel', { body: t.text }); }catch(e){}
      notifiedIds.add(t.id);
    }
  }
}

setInterval(()=>{ checkReminders(); renderAll(); }, 30000);

loadTasks();
setupNotifPrompt();
setTimeout(scrollToNow, 200);
</script>
</body>
