<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journée</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journée">
<meta name="theme-color" content="#ECE3D0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECE3D0;
    --card:#F8F2E4;
    --card-soft:#F2EADA;
    --ink:#3B3226;
    --ink-soft:#948868;
    --ink-faint:#B3A88A;
    --line:#DDD1B2;
    --accent:#B8863B;
    --accent-soft:#EAD9AF;
    --sage:#71805F;
    --sage-soft:#DEE3CD;
    --rust:#A5573F;
    --rust-soft:#EAD2C7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 16px 100px;
    position:relative;
  }

  /* header */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .day-name{
    font-size:12.5px;
    color:var(--ink-soft);
    text-transform:lowercase;
    margin-bottom:2px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:30px;
    margin:0;
    line-height:1.05;
  }
  .ring-wrap{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .ring-num{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* section titles */
  .section-title{
    font-size:12px;
    letter-spacing:.01em;
    color:var(--ink-soft);
    margin:0 0 10px 2px;
  }

  /* unscheduled tray */
  .tray{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:24px;
    scrollbar-width:none;
  }
  .tray::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 12px 8px 10px;
    font-size:13px;
    white-space:nowrap;
  }
  .chip.done{opacity:.5;}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .chip .txt.done{text-decoration:line-through;}
  .chip .del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:0 0 0 2px;line-height:1;}

  /* timeline */
  .timeline-outer{
    position:relative;
    background:var(--card-soft);
    border-radius:16px;
    border:1px solid var(--line);
    margin-bottom:28px;
    overflow:hidden;
  }
  .timeline-scroll{
    max-height:440px;
    overflow-y:auto;
    padding:6px 0;
  }
  .timeline{
    position:relative;
    padding-right:10px;
  }
  .hour-row{
    position:relative;
    height:56px;
    display:flex;
    border-top:1px solid var(--line);
  }
  .hour-row:first-child{border-top:none;}
  .hour-label{
    flex:0 0 52px;
    font-size:11px;
    color:var(--ink-faint);
    padding:4px 0 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .lane{flex:1;position:relative;}

  .task-card{
    position:absolute;
    left:6px;
    right:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:10px;
    padding:7px 10px;
    font-size:13.5px;
    line-height:1.25;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 1px 2px rgba(59,50,38,.05);
  }
  .task-card.done{
    border-left-color:var(--sage);
    opacity:.55;
  }
  .task-card.late{border-left-color:var(--rust);}
  .task-check{
    flex:0 0 auto;
    width:16px;height:16px;
    border-radius:50%;
    border:1.4px solid var(--ink-faint);
    background:transparent;
    cursor:pointer;
    position:relative;
    padding:0;
  }
  .task-check.done{background:var(--sage);border-color:var(--sage);}
  .task-check.done::after{
    content:'';position:absolute;left:4px;top:1px;
    width:4px;height:7px;border:solid var(--card);
    border-width:0 1.6px 1.6px 0;transform:rotate(40deg);
  }
  .task-info{flex:1;min-width:0;}
  .task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-title.done{text-decoration:line-through;color:var(--ink-soft);}
  .task-time{font-size:10.5px;color:var(--ink-soft);}
  .task-del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;flex:0 0 auto;padding:0;line-height:1;}

  .now-line{
    position:absolute;
    left:52px;right:0;
    height:0;
    border-top:1.5px solid var(--rust);
    z-index:5;
  }
  .now-line::before{
    content:'';
    position:absolute;
    left:-4px;top:-3.5px;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--rust);
  }

  /* agenda (future days) */
  .agenda-group{margin-bottom:20px;}
  .agenda-list{list-style:none;margin:0;padding:0;}
  .agenda-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px solid var(--line);
  }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .agenda-item .txt{flex:1;font-size:14px;}
  .agenda-item .txt.done{text-decoration:line-through;color:var(--ink-soft);}
  .agenda-item .when{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;}
  .agenda-item .del{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;padding:0;}

  .empty-note{
    color:var(--ink-faint);
    font-size:13px;
    text-align:center;
    padding:22px 10px;
  }

  /* floating add button */
  .fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--ink);
    color:var(--card);
    border:none;
    font-size:26px;
    font-weight:400;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(59,50,38,.28);
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }

  /* add sheet */
  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(59,50,38,.28);
    display:none;
    z-index:30;
  }
  .sheet-backdrop.open{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--card);
    border-radius:20px 20px 0 0;
    padding:20px 18px 24px;
    max-width:460px;
    margin:0 auto;
    transform:translateY(100%);
    transition:transform .22s ease;
    z-index:31;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-title{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    margin:0 0 14px;
  }
  .sheet input[type=text]{
    width:100%;
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    padding:11px 12px;
    margin-bottom:10px;
  }
  .sheet input[type=text]:focus{outline:2px solid var(--accent-soft);}
  .sheet-row2{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .sheet input[type=datetime-local]{
    flex:1;
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    padding:10px 10px;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:11px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--card);}
  .btn-primary:disabled{opacity:.35;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}

  .notif-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:-10px 0 20px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .notif-hint button{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 10px;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="day-name" id="dayName"></div>
      <h1>Aujourd'hui</h1>
    </div>
    <div class="ring-wrap">
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="17" fill="none" stroke="#DDD1B2" stroke-width="4"/>
        <circle id="ringProgress" cx="21" cy="21" r="17" fill="none" stroke="#B8863B" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8"
                transform="rotate(-90 21 21)"/>
      </svg>
      <div class="ring-num" id="ringNum">0/0</div>
    </div>
  </header>

  <div class="notif-hint" id="notifHint" style="display:none;">
    Active les notifications pour tes rappels.
    <button id="notifBtn">Activer</button>
  </div>

  <div id="trayWrap"></div>

  <div class="timeline-outer">
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div id="agendaWrap"></div>

</div>

<button class="fab" id="fabBtn" aria-label="Ajouter une tâche">+</button>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-title">Nouvelle tâche</div>
  <form id="addForm">
    <input type="text" id="taskInput" placeholder="Que faut-il faire ?" autocomplete="off">
    <div class="sheet-row2">
      <input type="datetime-local" id="dateInput">
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Ajouter</button>
    </div>
  </form>
</div>

<script>
const STORAGE_PREFIX = 'todo:';
const START_HOUR = 6;
const END_HOUR = 23; // inclusive
const ROW_H = 56;
let tasks = [];
let notifiedIds = new Set();

const dayName = document.getElementById('dayName');
const timelineEl = document.getElementById('timeline');
const timelineScroll = document.getElementById('timelineScroll');
const trayWrap = document.getElementById('trayWrap');
const agendaWrap = document.getElementById('agendaWrap');
const ringProgress = document.getElementById('ringProgress');
const ringNum = document.getElementById('ringNum');

const fabBtn = document.getElementById('fabBtn');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheet = document.getElementById('sheet');
const addForm = document.getElementById('addForm');
const taskInput = document.getElementById('taskInput');
const dateInput = document.getElementById('dateInput');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const notifHint = document.getElementById('notifHint');
const notifBtn = document.getElementById('notifBtn');

dayName.textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateShort(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'}) + ' · ' + fmtTime(iso); }

const LOCAL_KEY = 'journee_todos_v1';

async function loadTasks(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    tasks = raw ? JSON.parse(raw) : [];
  }catch(e){ tasks = []; }
  renderAll();
}
function persistAll(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(tasks)); }
  catch(e){ console.error('Erreur de sauvegarde', e); }
}
async function saveTask(t){ persistAll(); }
async function deleteTaskStorage(id){ persistAll(); }

function buildTimelineGrid(){
  let html = '';
  for(let h=START_HOUR; h<=END_HOUR; h++){
    const label = (h.toString().padStart(2,'0')) + ':00';
    html += `<div class="hour-row"><div class="hour-label">${label}</div><div class="lane"></div></div>`;
  }
  timelineEl.innerHTML = html;
}

function minutesToTop(hour, minute){
  const totalMinFromStart = (hour - START_HOUR) * 60 + minute;
  const clamped = Math.max(0, Math.min(totalMinFromStart, (END_HOUR - START_HOUR + 1) * 60 - 1));
  return (clamped / 60) * ROW_H;
}

function renderAll(){
  renderRing();
  renderTray();
  renderTimeline();
  renderAgenda();
}

function renderRing(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const circumference = 2 * Math.PI * 17;
  const pct = total === 0 ? 0 : done/total;
  ringProgress.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ringProgress.setAttribute('stroke-dashoffset', (circumference * (1-pct)).toFixed(1));
  ringNum.textContent = `${done}/${total}`;
}

function renderTray(){
  const now = new Date();
  const unscheduled = tasks.filter(t=>!t.due);
  if(unscheduled.length === 0){ trayWrap.innerHTML=''; return; }
  trayWrap.innerHTML = `
    <div class="section-title">Sans horaire</div>
    <div class="tray">
      ${unscheduled.map(t => `
        <div class="chip ${t.done?'done':''}" data-id="${t.id}">
          <button class="check-btn" data-action="toggle" data-id="${t.id}" style="all:unset;cursor:pointer;display:flex;">
            <span class="dot" style="background:${t.done ? 'var(--sage)':'var(--accent)'};"></span>
          </button>
          <span class="txt ${t.done?'done':''}">${escapeHtml(t.text)}</span>
          <button class="del" data-action="delete" data-id="${t.id}">×</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTimeline(){
  buildTimelineGrid();
  const lanes = timelineEl.querySelectorAll('.lane');
  const laneByHour = {};
  let h = START_HOUR;
  lanes.forEach(l => { laneByHour[h] = l; h++; });

  const now = new Date();
  const todays = tasks.filter(t => t.due && isSameDay(new Date(t.due), now));

  if(todays.length === 0){
    // still show grid, but note emptiness subtly via title area handled elsewhere
  }

  todays.forEach(t => {
    const d = new Date(t.due);
    const hour = Math.min(Math.max(d.getHours(), START_HOUR), END_HOUR);
    const lane = laneByHour[hour];
    if(!lane) return;
    const minuteOffset = d.getHours() < START_HOUR ? 0 : (d.getHours() > END_HOUR ? 0 : d.getMinutes());
    const late = !t.done && d < now;
    const card = document.createElement('div');
    card.className = `task-card ${t.done?'done':''} ${late?'late':''}`;
    card.style.top = minuteOffset + 'px';
    card.dataset.id = t.id;
    card.innerHTML = `
      <button class="task-check ${t.done?'done':''}" data-action="toggle" data-id="${t.id}"></button>
      <div class="task-info">
        <div class="task-title ${t.done?'done':''}">${escapeHtml(t.text)}</div>
        <div class="task-time">${fmtTime(t.due)}${late?' · en retard':''}</div>
      </div>
      <button class="task-del" data-action="delete" data-id="${t.id}">×</button>
    `;
    lane.appendChild(card);
  });

  // current time line
  if(now.getHours() >= START_HOUR && now.getHours() <= END_HOUR){
    const lane = laneByHour[now.getHours()];
    if(lane){
      const line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = now.getMinutes() + 'px';
      lane.appendChild(line);
    }
  }
}

function scrollToNow(){
  const now = new Date();
  const hour = Math.min(Math.max(now.getHours(), START_HOUR), END_HOUR);
  const rowIndex = hour - START_HOUR;
  const target = Math.max(0, rowIndex * ROW_H - ROW_H * 1.5);
  timelineScroll.scrollTop = target;
}

function renderAgenda(){
  const now = new Date();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);

  const upcoming = tasks
    .filter(t => t.due && !isSameDay(new Date(t.due), now) && new Date(t.due) > now)
    .sort((a,b)=> new Date(a.due) - new Date(b.due));

  const doneToday = tasks.filter(t => t.done && (!t.due || isSameDay(new Date(t.due), now)));

  let html = '';
  if(upcoming.length){
    html += `
      <div class="agenda-group">
        <div class="section-title">À venir</div>
        <ul class="agenda-list">
          ${upcoming.map(t => `
            <li class="agenda-item" data-id="${t.id}">
              <span class="dot"></span>
              <span class="txt">${escapeHtml(t.text)}</span>
              <span class="when">${fmtDateShort(t.due)}</span>
              <button class="del" data-action="delete" data-id="${t.id}">×</button>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }
  if(doneToday.length){
    html += `
      <div class="agenda-group">
        <div class="section-title">Fait aujourd'hui</div>
        <ul class="agenda-list">
          ${doneToday.map(t => `
            <li class="agenda-item" data-id="${t.id}">
              <span class="dot" style="background:var(--sage);"></span>
              <span class="txt done">${escapeHtml(t.text)}</span>
              <button class="del" data-action="delete" data-id="${t.id}">×</button>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }
  if(tasks.length === 0){
    html = `<div class="empty-note">Rien de prévu. Touche + pour ajouter une tâche.</div>`;
  }
  agendaWrap.innerHTML = html;
}

// delegated clicks
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;

  if(action === 'toggle'){
    t.done = !t.done;
    renderAll();
    await saveTask(t);
  } else if(action === 'delete'){
    tasks = tasks.filter(x=>x.id!==id);
    renderAll();
    await deleteTaskStorage(id);
  }
});

// sheet open/close
function openSheet(){
  sheetBackdrop.classList.add('open');
  sheet.classList.add('open');
  setTimeout(()=>taskInput.focus(), 150);
}
function closeSheet(){
  sheetBackdrop.classList.remove('open');
  sheet.classList.remove('open');
  taskInput.value=''; dateInput.value='';
  submitBtn.disabled = true;
}
fabBtn.addEventListener('click', openSheet);
cancelBtn.addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', closeSheet);

taskInput.addEventListener('input', ()=>{
  submitBtn.disabled = taskInput.value.trim().length === 0;
});

addForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = taskInput.value.trim();
  if(!text) return;
  const t = {
    id: uid(),
    text,
    due: dateInput.value ? new Date(dateInput.value).toISOString() : null,
    done: false,
    createdAt: Date.now()
  };
  tasks.push(t);
  renderAll();
  await saveTask(t);
  closeSheet();
});

// notifications
function setupNotifPrompt(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){ notifHint.style.display='flex'; }
}
notifBtn && notifBtn.addEventListener('click', async ()=>{
  try{
    const perm = await Notification.requestPermission();
    if(perm==='granted') notifHint.style.display='none';
  }catch(e){}
});
function checkReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  for(const t of tasks){
    if(t.done || !t.due || notifiedIds.has(t.id)) continue;
    if(new Date(t.due).getTime() <= now){
      try{ new Notification('Rappel', { body: t.text }); }catch(e){}
      notifiedIds.add(t.id);
    }
  }
}

setInterval(()=>{ checkReminders(); renderAll(); }, 30000);

loadTasks();
setupNotifPrompt();
setTimeout(scrollToNow, 200);
</script>
</body>
</html>
